    var KEY = 'user_uiLang';
    var codes = LANGS.map(function (l) { return l[0]; });


    function sellerCodeFromLocation() {
        try {
            var q = new URLSearchParams(location.search).get('s');
            if (q) return q;
            var parts = location.pathname.split('/').filter(function (p) { return p.length > 0; });
            var last = (parts[parts.length - 1] || '').replace(/\.html?$/i, '');
            if (/^[0-9a-zA-Z]{8,24}$/.test(last)) return last;
        } catch (e) {}
        return '';
    }

    function detect() {
        try {
            var q = new URLSearchParams(location.search).get('lang');
            if (q && codes.indexOf(q) > -1) return q;
        } catch (e) {}
        try {
            var sid = sellerCodeFromLocation();
            if (sid) {
                var cached = sessionStorage.getItem('kefu_vlang_' + sid);
                if (cached && codes.indexOf(cached) > -1) return cached;
            }
        } catch (e) {}
        try {
            var saved = localStorage.getItem(KEY);
            if (saved && codes.indexOf(saved) > -1) return saved;
        } catch (e) {}
        var nav = String((navigator.languages && navigator.languages[0]) || navigator.language || 'zh-CN').toLowerCase();
        if (/^zh-(tw|hk|mo|hant)/.test(nav)) return 'zh-TW';
        if (nav.indexOf('zh') === 0) return 'zh-CN';
        var p = nav.split('-')[0];
        return codes.indexOf(p) > -1 ? p : 'en';
    }

    var lang = detect();
    var listeners = [];

    function T(zh) {
        if (zh === undefined || zh === null || lang === 'zh-CN') return zh;
        var row = D[String(zh).trim()];
        if (!row) return zh;
        return row[COLS.indexOf(lang)] || zh;
    }

    function trSys(text) {
        if (!text || lang === 'zh-CN') return text;
        var t = T(text);
        if (t !== text) return t;
        var s = String(text);
        if (s.length > 4 && s.slice(-4) === '为您服务') {
            return T('{n}为您服务').replace('{n}', T(s.slice(0, -4)));
        }
        return text;
    }

    function applyStatic(root) {
        root = root || document;
        var i, els;
        els = root.querySelectorAll('[data-zh]');
        for (i = 0; i < els.length; i++) els[i].textContent = T(els[i].getAttribute('data-zh'));
        els = root.querySelectorAll('[data-zh-ph]');
        for (i = 0; i < els.length; i++) els[i].placeholder = T(els[i].getAttribute('data-zh-ph'));
        els = root.querySelectorAll('[data-zh-title]');
        for (i = 0; i < els.length; i++) els[i].title = T(els[i].getAttribute('data-zh-title'));
    }

    function setText(el, zh) {
        if (!el) return;
        el.setAttribute('data-zh', zh == null ? '' : zh);
        el.textContent = T(zh);
    }

    function setPlaceholder(el, zh) {
        if (!el) return;
        el.setAttribute('data-zh-ph', zh == null ? '' : zh);
        el.placeholder = T(zh);
    }

    function setLang(code, remember) {
        if (codes.indexOf(code) < 0) return;
        var keep = remember !== false;
        if (code === lang) {
            if (keep) {
                try { localStorage.setItem(KEY, code); } catch (e) {}
            }
            return;
        }
        lang = code;
        if (keep) {
            try { localStorage.setItem(KEY, code); } catch (e) {}
        }
        document.documentElement.lang = code;
        applyStatic();
        listeners.forEach(function (fn) { try { fn(code); } catch (e) {} });
    }

    document.documentElement.lang = lang;

    window.KefuI18n = {
        langs: LANGS,
        T: T,
        trSys: trSys,
        applyStatic: applyStatic,
        setText: setText,
        setPlaceholder: setPlaceholder,
        setLang: setLang,
        getLang: function () { return lang; },
        onChange: function (fn) { listeners.push(fn); }
    };
})();

        .iconfont { font-style: normal; -webkit-font-smoothing: antialiased; cursor: pointer; font-family: iconfont !important; }

        .iconicon_widget_face::before { content: "\e6e0"; }
        .iconicon_widget_picture::before { content: "\e6e1"; }
        .iconicon_widget_video::before { content: "\e6e4"; }
        .iconicon_widget_assess::before { content: "\e6e3"; }

        .root { width: 100%; height: 100%; position: relative; }
        .main-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            overflow: hidden; position: relative; background: rgb(252, 252, 252);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .title-bar {
            width: 100%; padding: 10px 12px; display: flex; min-height: 60px;
            font-size: 14px; color: white; background: rgb(0, 122, 255);
            align-items: center;
        }
        .title-bar .back-btn { display: flex; margin-right: 4px; }
        .title-bar .back-btn .back { width: 20px; height: 20px; transform: rotate(90deg); }
        .title-bar .title-right { width: 100px; flex: 1 1 auto; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .title-bar .name-bar { display: flex; flex-direction: column; justify-content: center; height: auto; line-height: 1.4; align-items: flex-start; }
        .title-bar .name-bar .chat-box-title { font-size: 15px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; }
        .title-bar .name-bar .name { flex: 0 0 auto; font-size: 12px; opacity: 0.85; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; }
        .title-bar .title-avatar { width: 40px; height: 40px; margin-right: 10px; border-radius: 3px; }
        .title-bar .sound-btn { margin-left: auto; font-size: 16px; color: #fff; cursor: pointer; display: flex; align-items: center; padding: 0 8px; user-select: none; }
        .title-bar .sound-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .title-bar { position: relative; }
        .title-bar .lang-btn { margin-left: auto; color: #fff; cursor: pointer; display: flex; align-items: center; padding: 0 8px; user-select: none; }
        .title-bar .lang-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .title-bar .lang-btn + .sound-btn { margin-left: 0; }
        .lang-menu { display: none; position: absolute; top: 100%; right: 8px; z-index: 60; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 4px 0; max-height: 320px; overflow-y: auto; min-width: 150px; }
        .lang-menu.show { display: block; }
        .lang-menu .lang-item { padding: 8px 14px; font-size: 13px; color: #333; cursor: pointer; white-space: nowrap; display: flex; align-items: center; justify-content: space-between; }
        .lang-menu .lang-item:hover { background: #f2f6ff; }
        .lang-menu .lang-item.active { color: #007AFF; font-weight: 500; }
        .lang-menu .lang-item.active::after { content: '✓'; margin-left: 12px; }
        .title-bar .close-btn { font-size: 20px; color: #fff; margin-left: 10px; margin-right: 10px; cursor: pointer; }

        .msg-area { background: rgb(252, 252, 252); flex: 1 1 auto; height: 100px; display: flex; flex-direction: column; position: relative; }
        .msg-scroll { width: 100%; height: 100%; padding: 14px; box-sizing: border-box; overflow-y: auto; position: relative; }
        .msg-scroll::-webkit-scrollbar { width: 2px; }
        .msg-scroll::-webkit-scrollbar-track { border-radius: 10px; }
        .msg-scroll::-webkit-scrollbar-thumb { border-radius: 10px; background: #e3eaff; }

        .load-more { font-size: 12px; text-align: center; color: #1E9FFF; cursor: pointer; padding: 8px 0; }
        .load-more:hover { text-decoration: underline; }

        .msg-item { width: 100%; position: relative; padding-top: 10px; padding-bottom: 10px; padding-left: 10px; }
        .msg-item::after { content: " "; display: table; clear: both; }

        .msg-left .msg-avatar { width: 36px; height: 36px; margin-right: 10px; margin-top: 16px; vertical-align: top; float: left; border-radius: 3px; }
        .msg-left .msg-info { float: left; text-align: left; max-width: calc(100% - 50px); }
        .msg-left .msg-name { color: rgb(178, 178, 178); font-size: 12px; margin-bottom: 2px; }
        .msg-left .msg-bubble { max-width: 100%; position: relative; background-color: rgb(255, 255, 255); border-radius: 3px; border: 1px solid rgb(240, 240, 240); float: left; }
        .msg-left .msg-bubble::before { position: absolute; width: 0; height: 0; content: ''; border: 5px solid transparent; left: -10px; right: auto; top: 12px; border-right-color: #fff; }
        .msg-left .msg-bubble .msg-text { padding: 10px 15px; border-radius: 3px; font-size: 13px; word-break: break-word; color: #444; white-space: pre-wrap; }
        #msgList, #msgList * { -webkit-user-select: text; user-select: text; }
        #msgList img, #previewImg { -webkit-touch-callout: default; }
        .msg-left .msg-bubble .msg-text img { max-width: 100%; max-height: 150px; cursor: pointer; }
        .msg-left .msg-bubble .msg-text video { width: 150px; height: 150px; }

        .msg-right .msg-info { float: right; text-align: right; max-width: calc(100% - 50px); }
        .msg-right .msg-name { color: rgb(178, 178, 178); font-size: 12px; }
        .msg-right .msg-bubble { max-width: 100%; position: relative; background-color: rgb(0, 122, 255); border-radius: 3px; border: 1px solid rgb(240, 240, 240); margin-left: 30px; float: right; }
        .msg-right .msg-bubble::before { position: absolute; width: 0; height: 0; content: ''; border: 5px solid transparent; left: auto; right: -10px; top: 12px; border-left-color: rgb(0, 122, 255); }
        .msg-right .msg-bubble .msg-text { padding: 10px 15px; border-radius: 3px; font-size: 13px; word-break: break-word; color: white; white-space: normal; text-align: left; white-space: pre-wrap; }
        .msg-right .msg-bubble .msg-text img { max-width: 100%; max-height: 150px; cursor: pointer; }
        .msg-right .msg-bubble .msg-text video { width: 150px; height: 150px; }
        .msg-right .read-flag { display: none !important; } /* 客户前端不展示已读/未读 */
        .msg-right .read-flag span { color: #b5b5b5; font-size: 12px; }

        .msg-system { text-align: center; padding: 10px 0; }
        .msg-system .sys-text { font-size: 12px; color: #b5b5b5; }
        .msg-system .sys-text a { color: #1E9FFF; cursor: pointer; text-decoration: none; }

        .msg-question-list { padding: 10px 15px; }
        .msg-question-list p { margin: 0 0 5px 0; color: #444; font-size: 13px; }
        .msg-question-list .q-item { cursor: pointer; color: #1E9FFF; margin-top: 5px; font-size: 13px; }
        .msg-question-list .q-item:hover { text-decoration: underline; }

        .msg-common-question .msg-text { padding: 10px 15px; }
        .msg-common-question .msg-text .cq-title { color: #444; }
        .msg-common-question .msg-text .cq-item { color: #1E9FFF; cursor: pointer; display: block; margin-top: 5px; }
        .msg-common-question .msg-text .cq-item:hover { text-decoration: underline; }

        .input-area { width: 100%; background: rgb(255, 255, 255); border-top: 1px solid rgb(237, 237, 237); }
        .input-toolbar { width: 100%; position: relative; box-sizing: border-box; padding: 6px 6px 0px; margin-bottom: 4px; display: flex; align-items: center; }
        .toolbar-btns { display: flex; justify-content: flex-start; align-items: center; flex-wrap: nowrap; }
        .toolbar-btns .tb-btn { margin-right: 6px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .toolbar-btns .tb-btn i { color: rgb(102, 102, 102); font-size: 24px; }
        .toolbar-btns .tb-btn .relink-text { font-size: 12px; color: #1E9FFF; position: relative; top: -3px; }

        .emoji-panel {
            display: none; position: absolute; bottom: 100%; left: 0; background: #fff;
            border: 1px solid #e8e8e8; border-radius: 8px; padding: 8px; width: 320px;
            max-height: 240px; z-index: 100;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            opacity: 0; transform: translateY(4px); transition: opacity 0.2s, transform 0.2s;
        }
        .emoji-panel.show { display: flex; flex-direction: column; opacity: 1; transform: translateY(0); }
        .emoji-panel .emoji-tabs { display: flex; border-bottom: 1px solid #eee; margin-bottom: 6px; flex-shrink: 0; }
        .emoji-panel .emoji-tab { flex: 1; text-align: center; padding: 6px 0; font-size: 12px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
        .emoji-panel .emoji-tab:hover { color: #1E9FFF; }
        .emoji-panel .emoji-tab.active { color: #1E9FFF; border-bottom-color: #1E9FFF; }
        .emoji-panel .emoji-body { flex: 1; overflow-y: auto; min-height: 0; }
        .emoji-panel .emoji-body::-webkit-scrollbar { width: 4px; }
        .emoji-panel .emoji-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
        .emoji-panel .emoji-body::-webkit-scrollbar-thumb:hover { background: #bbb; }
        .emoji-panel .emoji-tab-content { display: none; flex-wrap: wrap; gap: 2px; padding: 2px 0; min-height: 200px; }
        .emoji-panel .emoji-tab-content.active { display: flex; }
        .emoji-panel .emoji-item { font-size: 22px; width: 34px; height: 34px; text-align: center; line-height: 34px; cursor: pointer; border-radius: 6px; transition: background 0.15s, transform 0.15s; }
        .emoji-panel .emoji-item:hover { background: #f0f0f0; transform: scale(1.15); }
        .emoji-panel .emoji-item.emoji-img-item { width: 34px; height: 34px; line-height: 34px; }
        .emoji-panel .emoji-item.emoji-img-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .emoji-panel .emoji-item.emoji-img-item:hover { transform: scale(1.1); }

        .input-row { width: 100%; display: flex; padding: 0 6px 8px; align-items: flex-end; }
        .input-row .lang-select-wrap { flex: 0 0 auto; margin-right: 6px; align-self: center; }
        .input-row .textarea-wrap { flex: 1 1 auto; width: 100px; }
        .input-row textarea {
            display: block; width: 100%; padding: 0px 6px; outline: 0px;
            background: rgb(243, 244, 248); border: none; font-size: 14px;
            min-height: 40px; max-height: 84px; resize: none;
            font-family: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            line-height: 40px;
        }
        .input-row .send-wrap { flex: 0 0 70px; width: 70px; margin-left: 6px; height: 40px; line-height: 40px; align-self: flex-end; }
        .send-btn {
            width: auto; height: auto; display: inline-block; vertical-align: middle;
            font-size: 14px; border: 0px; outline: none; border-radius: 3px;
            cursor: pointer; text-align: center; text-decoration: none; opacity: 1;
            color: white; background: rgb(0, 122, 255); padding: 8px 16px;
        }
        .send-btn:active { opacity: 0.8; }

        .hidden-input { visibility: hidden; position: absolute; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 10000001; justify-content: center; align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fff; border-radius: 8px; padding: 24px; width: 360px; max-width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); position: relative;
        }
        .modal-box h3 { font-size: 16px; margin-bottom: 16px; color: #333; }
        .modal-close {
            position: absolute; top: 12px; right: 14px; width: 24px; height: 24px;
            line-height: 24px; text-align: center; font-size: 18px; color: #999;
            cursor: pointer; border: none; background: none; padding: 0;
            transition: color 0.2s;
        }
        .modal-close:hover { color: #333; }
        .modal-box .form-group { margin-bottom: 12px; }
        .modal-box .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
        .modal-box .form-group input,
        .modal-box .form-group textarea {
            width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px;
            font-size: 14px; outline: none; font-family: inherit;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group textarea:focus { border-color: #1E9FFF; }
        .modal-box .form-group textarea { resize: none; height: 80px; }
        .modal-box .modal-btn {
            width: 100%; padding: 10px; border: none; border-radius: 4px;
            font-size: 14px; cursor: pointer; color: #fff; background: #1E9FFF; margin-top: 8px;
        }
        .modal-box .modal-btn:active { opacity: 0.8; }
        .modal-box .modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal-box .alert-success {
            background: #f0f9eb; color: #67c23a; padding: 8px 12px; border-radius: 4px;
            font-size: 13px; margin-bottom: 12px;
        }

    <script>
        (function() {
            function isMobile() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone/i.test(navigator.userAgent);
            }
            if (isMobile()) {
                document.documentElement.className = 'is-mobile';
            } else {
                document.documentElement.className = 'is-pc';
            }
            // 在 iframe 内加载时（loader.js 嵌入），让 .root 自适应 iframe 尺寸
            // 而不是按 .is-pc 默认的 500x610 固定居中
            try {
                if (window.self !== window.top) {
                    document.documentElement.className += ' in-iframe';
                }
            } catch (e) {
                // 跨域 iframe 访问 window.top 会抛错，按 iframe 处理
                document.documentElement.className += ' in-iframe';
            }
        })();
    </script>
    <script>
        (function () {
            function block(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
            function inMsg(e) {
                var t = e.target;
                if (t && t.nodeType !== 1) t = t.parentNode;
                return !!(t && t.closest && t.closest('#msgList, #previewImg'));
            }
            // document.addEventListener('contextmenu', block, true);
            // document.addEventListener('dragstart', block, true);
            document.addEventListener('contextmenu', function (e) { if (!inMsg(e)) block(e); }, true);
            document.addEventListener('dragstart', function (e) { if (!inMsg(e)) block(e); }, true);
            document.addEventListener('selectstart', function (e) {
                var tag = (e.target && e.target.tagName || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
                if (inMsg(e)) return;
                block(e);
            }, true);
            document.addEventListener('keydown', function (e) {
                var key = e.key || '';
                var code = e.keyCode || e.which;
                if (code === 123 || key === 'F12') return block(e);
                if (e.ctrlKey && e.shiftKey && (key === 'I' || key === 'i' || key === 'J' || key === 'j' || key === 'C' || key === 'c' || code === 73 || code === 74 || code === 67)) return block(e);
                if (e.ctrlKey && (key === 'U' || key === 'u' || key === 'S' || key === 's' || code === 85 || code === 83)) return block(e);
                if (e.metaKey && e.altKey && (key === 'I' || key === 'i' || key === 'J' || key === 'j' || key === 'C' || key === 'c')) return block(e);
            }, true);
            var locked = false;
            function lockPage() {
                if (locked) return;
                locked = true;
                try {
                    document.documentElement.innerHTML = '';
                    document.write('');
                } catch (err) {}
                try { window.stop(); } catch (err2) {}
                location.replace('about:blank');
            }
            function isMobileUa() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone/i.test(navigator.userAgent);
            }
            function checkDevtools() {
                if (isMobileUa()) return;
                var threshold = 160;
                var wide = window.outerWidth - window.innerWidth > threshold;
                var tall = window.outerHeight - window.innerHeight > threshold;
                if (wide || tall) lockPage();
            }
            setInterval(checkDevtools, 800);
            window.addEventListener('resize', checkDevtools);
            setInterval(function () {
                if (isMobileUa()) return;
                var t0 = performance.now();
                debugger;
                if (performance.now() - t0 > 100) lockPage();
            }, 2000);
        })();
    </script>

        function httpGet(url) {
            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                var sep = url.indexOf('?') === -1 ? '?' : '&';
                xhr.open('GET', url + sep + '_=' + new Date().getTime(), true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try { resolve(JSON.parse(xhr.responseText)); }
                            catch(e) { reject(e); }
                        } else { reject(new Error('HTTP ' + xhr.status)); }
                    }
                };
                xhr.send();
            });
        }

        function httpPost(url, data, asJson) {
            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open('POST', url, true);
                if (data instanceof FormData) {
                    xhr.send(data);
                } else if (asJson) {
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.send(JSON.stringify(data));
                } else {
                    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                    var pairs = [];
                    for (var key in data) {
                        if (data.hasOwnProperty(key)) {
                            var val = data[key];
                            if (typeof val === 'object') {
                                pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(JSON.stringify(val)));
                            } else {
                                pairs.push(encodeURIComponent(key) + '=' + encodeURIComponent(val));
                            }
                        }
                    }
                    xhr.send(pairs.join('&'));
                }
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try { resolve(JSON.parse(xhr.responseText)); }
                            catch(e) { reject(e); }
                        } else { reject(new Error('HTTP ' + xhr.status)); }
                    }
                };
            });
        }

        function parseUrl() {

            var parts = path.split('/').filter(function(p) { return p.length > 0; });
            var lastPart = parts[parts.length - 1] || '';

            if (lastPart === 'index.html' || lastPart === '404.html' || lastPart === '') {
                state.sub_fix = params.get('sub_fix') || '';
                if (!state.seller_code && parts.length >= 2) {
                    var possibleCode = parts[parts.length - 2];
                    if (possibleCode !== 'user' && possibleCode !== 'kefu' && possibleCode !== 'webchat') {
                        state.seller_code = possibleCode;
                    }
                }
            } else {
                state.sub_fix = lastPart;
                if (!state.seller_code) {
                    state.seller_code = lastPart;
                }
            }

            if (state.chatType === 0) {
                state.chatType = state.seller_code ? 2 : 1;
            }
        }

        function memberUid(account) {
            account = String(account || '').replace(/["'\\]/g, '').trim();
            if (!account) return '';
            if (account.length <= 32) return account;
            var h1 = 2166136261;
            var h2 = 2166136261;
            for (var i = 0; i < account.length; i++) {
                h1 ^= account.charCodeAt(i);
                h1 = Math.imul(h1, 16777619);
                h2 ^= account.charCodeAt(account.length - 1 - i);
                h2 = Math.imul(h2, 16777619);
            }
            function hex(n) {
                return ('00000000' + (n >>> 0).toString(16)).slice(-8);
            }
            return (hex(h1) + hex(h2)).slice(0, 32);
        }

        function applyMemberIdentity() {
            var account = String(state.customer.member_account || state.memberAccount || state.userId || '').replace(/["'\\]/g, '').trim();
            var name = String(state.customer.member_name || state.memberName || state.userNick || '').trim();
            if (account) {
                state.memberAccount = account;
                state.customer.member_account = account;
                state.customer.uid = memberUid(account);
            }
            if (name) {
                state.memberName = name;
                state.customer.member_name = name;
                state.customer.uName = name;
            }
        }

            try {
                state.websock = new WebSocket(wsUrl);
            } catch(e) {
                reconnect();
                return;
            }
            state.websock.onopen = websocketonopen;
            state.websock.onerror = websocketonerror;
            state.websock.onmessage = websocketonmessage;
            state.websock.onclose = websocketclose;
        }

        function reconnect() {
            if (state.lockReconnect) return;
            showLoading('重连中...');
            state.lockReconnect = true;
            if (state.timeoutnum) clearTimeout(state.timeoutnum);
            state.timeoutnum = setTimeout(function() {
                initWebSocket();
                state.lockReconnect = false;
            }, 5000);
        }

        function resetHeartbeat() {
            clearTimeout(state.timeoutObj);
            clearTimeout(state.serverTimeoutObj);
            startHeartbeat();
        }

        function startHeartbeat() {
            state.timeoutObj = setTimeout(function() {
                if (state.websock && state.websock.readyState == 1) {
                    state.websock.send(JSON.stringify({ cmd: 'ping' }));
                } else {
                    reconnect();
                }
                state.serverTimeoutObj = setTimeout(function() {
                    if (state.websock) state.websock.close();
                }, state.timeout);
            }, state.timeout);
        }

        var TRANS_LANG = { 'zh-CN': 'zh', 'zh-TW': 'cht', 'en': 'en', 'ja': 'jp', 'ko': 'kor', 'es': 'spa', 'pt': 'pt', 'tr': 'tr', 'ar': 'ara', 'th': 'th', 'vi': 'vie', 'de': 'de', 'it': 'it', 'ru': 'ru' };
        function sendVisitorLang() {
            if (!state.customer || !state.customer.uid) return;
            websocketsend(JSON.stringify({
                cmd: 'setLang',
                data: { uid: state.customer.uid, seller_code: state.customer.seller, lang: TRANS_LANG[I18.getLang()] || 'zh' }
            }));
        }
        I18.onChange(sendVisitorLang);

        // 发布新版后自动刷新：打开页面时记下 version.txt，之后它变化就重新加载；访客正在输入时延后
        var PAGE_VERSION = '';
        var versionReloadPending = false;
        function checkPageVersion() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://youqiam.pages.dev/version.txt?t=' + Date.now(), true);
            xhr.onload = function() {
                var v = String(xhr.responseText || '').trim();
                if (xhr.status !== 200 || !/^[\w.-]{6,40}$/.test(v)) return;
                if (!PAGE_VERSION) { PAGE_VERSION = v; return; }
                if (v === PAGE_VERSION) return;
                versionReloadPending = true;
                reloadIfIdle();
            };
            xhr.send();
        }
        checkPageVersion();
        function reloadIfIdle() {
            if (!versionReloadPending) return;
            var input = $('chatInput');
            if (input && input.value.trim()) return;
            location.reload();
        }
        setInterval(checkPageVersion, 60000);
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') checkPageVersion();
        });
        $('chatInput').addEventListener('blur', reloadIfIdle);
        $('chatInput').addEventListener('input', function() {
            if (!$('chatInput').value.trim()) reloadIfIdle();
        });

        function websocketonopen() {
            hideLoading();
            sendVisitorLang();
            if (state.hasOpen == 0 && state.chatType == 1) {
                websocketsend(JSON.stringify({
                    cmd: 'customerIn',
                    data: {
                        customer_id: state.customer.uid,
                        customer_name: state.customer.uName,
                        customer_avatar: state.customer.avatar,
                        seller_code: state.customer.seller,
                        userType: state.customer.userType,
                        referrer: state.customer.referrer,
                        sourceUrl: state.customer.sourceUrl || ''
                    }
                }));
            } else if (state.chatType == 2) {
                state.hasOpen = 1;
                userInit();
            }
            startHeartbeat();
        }

        function websocketonerror() {
            state.hasOpen = 0;
            state.activeClick = 0;
            reconnect();
        }

        function websocketclose() {
            state.hasOpen = 0;
            state.activeClick = 0;
            reconnect();
        }

        function websocketonmessage(event) {
            var res;
            try { res = JSON.parse(event.data); } catch(e) { return; }
            console.log('[WS RECV]', res);
            resetHeartbeat();
            switch (res.cmd) {
                case 'userInit': userInitHandle(res); break;
                case 'customerIn':
                    if (state.chatType == 1) {
                        if (state.keep_chat_window == 1) localStorage.setItem(window._k('keepChatOpen'), '1');
                        try { top.postMessage('init_complete', '*'); } catch(e) {}
                    }
                    break;
                case 'ring': playSound(); break;
                case 'readMessage': readHandle(res); break;
                case 'afterSend': afterSendHandle(res.data); break;
                case 'chatMessage': playSound(); handleChatMsg(res.data); break;
                case 'praiseKf': showPraiseModal(); break;
                case 'comQuestion':
                    localStorage.setItem(window._k('comQuestion'), JSON.stringify(res.data));
                    break;
                case 'hello':
                    localStorage.setItem(window._k('hello'), JSON.stringify(res.data));
                    break;
                case 'answerComQuestion': handleAutoAnswer(res.data); break;
                case 'isClose':
                    console.log('[isClose]', res.data);
                    var endByAdmin = res.data && res.data.endByAdmin;
                    state.dataList.push({ type: 3, content: (res.data && res.data.msg) || state.front_msg.offline_kefu, leave: 1 });
                    state.lastStatusTip = '';
                    state.serviceKefu = {};
                    renderMessages();
                    scrollToBottom();
                    state.canChat = 0;
                    hideLoading();
                    if (endByAdmin) {
                        // 客服主动结束对话，重置状态以便下次进入时重新触发无消息访客引导
                        localStorage.setItem(window._k('adminEnded'), '1');
                    }
                    break;
                case 'reLink': relinkHandle(res.data); break;
                case 'autoLink':
                    if (state.activeClick == 0) {
                        playSound();
                        if (state.keep_chat_window == 1) localStorage.setItem(window._k('keepChatOpen'), '1');
                        if (state.chatType == 1) {
                            if (shouldAutoExpand()) {
                                try { top.postMessage('show_chat', '*'); } catch(e) {}
                            } else {
                                state.unreadCount++;
                                try { top.postMessage(JSON.stringify({ cmd: 'unread_count', count: state.unreadCount }), '*'); } catch(e) {}
                            }
                        }
                    }
                    break;
                case 'rollBackMessage': rollBackMessage(res.data); break;
                case 'kefuStatusChange': kefuStatusChangeHandle(res); break;
            }
        }

        function websocketsend(msg) {
            if (state.websock && state.websock.readyState == 1) {
                state.websock.send(msg);
            }
        }

        function userInit() {
            pushCustomerReferrer();
            websocketsend(JSON.stringify({
                cmd: 'userInit',
                data: {
                    uid: state.customer.uid,
                    name: state.customer.member_name || state.memberName || state.customer.uName,
                    avatar: state.customer.avatar,
                    seller: state.customer.seller,
                    userType: state.customer.userType,
                    type: state.chatType,
                    referrer: state.customer.referrer || '',
                    sourceUrl: state.customer.sourceUrl || window.location.href || '',
                    member_account: state.customer.member_account || state.memberAccount || '',
                    member_name: state.customer.member_name || state.memberName || ''
                }
            }));
        }

        function pushCustomerReferrer() {
            httpPost(API_URL + '/index/index/updateUserInfo', {
                customer_id: state.customer.uid,
                seller_code: state.customer.seller,
                referrer: state.customer.referrer,
                agent: state.customer.agent,
                self_content: state.formList,
                member_account: state.customer.member_account || state.memberAccount || '',
                member_name: state.customer.member_name || state.memberName || ''
            }, true);
        }

        /**
         * 主动降级：无在线客服时立即显示离线留言界面，
         * 不等 WebSocket isClose 链路（后者可能在第三方嵌入环境下失败）。
         * 由 c_info 处理器在已知 is_online=false 时调用。
         */
        function offlineFallback() {
            state.dataList.push({
                type: 3,
                content: state.front_msg.offline_kefu || '暂无客服在线，请留言',
                leave: 1
            });
            state.canChat = 0;
            renderMessages();
            scrollToBottom();
        }

        // 根据"对话扩展"配置控制图片/文件传输按钮的显隐
        function applyTransferSwitches() {
            if (!state.front_msg) return;
            var imgBtn = $('imgBtn');
            var fileBtn = $('fileBtn');
            if (imgBtn) {
                imgBtn.style.display = (state.front_msg.image_transfer_switch == 0) ? 'none' : '';
            }
            if (fileBtn) {
                fileBtn.style.display = (state.front_msg.file_transfer_switch == 0) ? 'none' : '';
            }
        }

        function userInitHandle(res) {
            var data = res.data;
            console.log('[userInitHandle] code=' + data.code + ' msg=' + data.msg, data);
            if (data.code == 201) {
                httpGet(API_URL + '/index/index/getBlackList').then(function(apiRes) {
                    if (apiRes.code == 0) {
                        window.location.href = apiRes.data;
                    }
                });
                return;
            }
            if (data.code == 0) {
                var assignedId = data.data && data.data.customer_id;
                if (assignedId && assignedId !== state.customer.uid && !state.memberAccount && !state.memberName) {
                    state.customer.uid = assignedId;
                    state.customer.uName = '访客' + assignedId;
                    try { localStorage.setItem(window._k('customerInfo'), JSON.stringify(state.customer)); } catch (e) {}
                }
                hideLoading();
                state.userInitRetry = 0;
                state.canChat = 1;
                state.serviceKefu = data.data;
                state.search.u = state.customer.seller;
                state.search.uid = state.customer.uid;
                state.search.page = 1;
                applyHeaderTitle();
                if (state.serviceKefu.kefu_avatar) {
                    state.headerAvatar = state.serviceKefu.kefu_avatar;
                }
                applyTitleAvatar(state.headerAvatar);
                applyHeaderTitle();
                // 新服务分配（如客服结束对话后重连），重置引导消息状态
                if (data.newService) {
                    localStorage.setItem(window._k('adminEnded'), '1');
                }
                getChatLog();
            } else if (data.code == 400) {
                state.userInitRetry = (state.userInitRetry || 0) + 1;
                if (state.userInitRetry <= 5) {
                    showLoading('分配客服中...');
                    var delay = state.userInitRetry * 2000;
                    setTimeout(function() {
                        userInit();
                    }, delay);
                } else {
                    hideLoading();
                    state.canChat = 0;
                    state.dataList.push({ type: 3, content: '暂无可用客服，请稍后再试', leave: 1 });
                    renderMessages();
                    scrollToBottom();
                }
            } else if (data.code == 429) {
                // 对话防刷拦截
                hideLoading();
                state.canChat = 0;
                state.dataList.push({ type: 3, content: data.msg || '访问过于频繁，请稍后再试', leave: 1 });
                renderMessages();
                scrollToBottom();
            } else if (data.code == 430) {
                hideLoading();
                state.canChat = 0;
                var offMsg = data.msg || '当前不在服务时间，请留言';
                var hasLeave = state.dataList.some(function(item) { return item.leave == 1; });
                if (!hasLeave) {
                    state.dataList.push({ type: 3, content: offMsg, leave: 1 });
                    renderMessages();
                    scrollToBottom();
                }
            } else {
                hideLoading();
                state.dataList.push({ type: 3, content: data.msg || '服务不可用', leave: 1 });
                renderMessages();
            }
        }

        function readHandle(res) {
            var mid = String(res.data.mid).split(',');
            state.dataList.forEach(function(item, index) {
                if (mid.indexOf(String(item.chat_log_id)) !== -1) {
                    state.dataList[index].read_flag = 2;
                }
            });
            renderMessages();
        }

        function scheduleTextSendUnlock(lockUntil) {
            var until = lockUntil || state.textSendLockUntil || 0;
            var delay = Math.max(0, until - Date.now());
            if (state.textSendUnlockTimer) {
                clearTimeout(state.textSendUnlockTimer);
            }
            state.textSendUnlockTimer = setTimeout(function() {
                state.textSendUnlockTimer = null;
                state.textSendLockUntil = 0;
                var sendBtn = $('sendBtn');
                if (sendBtn) sendBtn.disabled = false;
            }, delay);
        }

        function applyOutboundChatMsg(item) {
            if (!item) return;
            var timeStr = '';
            if (item.time) {
                var timeParts = item.time.split(' ');
                timeStr = timeParts.length > 1 ? timeParts[1].substr(0, timeParts[1].length - 3) : item.time;
            }
            for (var i = state.dataList.length - 1; i >= 0; i--) {
                var row = state.dataList[i];
                if (row.type === 1 && (!row.chat_log_id || row.chat_log_id === 0) && row.msg_type === item.msg_type && row.content === item.content) {
                    row.chat_log_id = item.chat_log_id;
                    row.time = timeStr || row.time;
                    row.id = item.id;
                    row.name = item.name;
                    row.avatar = item.avatar;
                    row.translate_content = item.translate_content;
                    row.language = item.language;
                    row.read_flag = item.read_flag != null ? item.read_flag : 1;
                    renderMessages();
                    scrollToBottom();
                    return;
                }
            }
            sendHandle(item);
        }

        function afterSendHandle(data) {
            if (data.code == 401) {
                state.canChat = 0;
                state.dataList.push({ type: 3, content: data.msg || '客服不在线', leave: 1 });
                renderMessages();
                scrollToBottom();
                scheduleTextSendUnlock();
                return;
            }
            if (data.code == 400) {
                state.dataList.push({ type: 3, content: data.msg || '消息发送失败' });
                renderMessages();
                scrollToBottom();
                scheduleTextSendUnlock();
                return;
            }
            applyOutboundChatMsg(data.chatMsg);
            scheduleTextSendUnlock();
        }

        function sendHandle(item) {
            var timeStr = '';
            if (item.time) {
                var timeParts = item.time.split(' ');
                timeStr = timeParts.length > 1 ? timeParts[1].substr(0, timeParts[1].length - 3) : item.time;
            }
            state.dataList.push({
                name: item.name, avatar: item.avatar, id: item.id,
                time: timeStr, msg_type: item.msg_type,
                content: item.content,
                translate_content: item.translate_content,
                language: item.language, protocol: 'ws',
                chat_log_id: item.chat_log_id, type: 1, read_flag: 1
            });
            state.content = '';
            $('chatInput').value = '';
            renderMessages();
            scrollToBottom();
        }

        function handleChatMsg(item) {
            if (state.hasOpen == 0) {
                state.hasOpen = 1;
                if (state.keep_chat_window == 1) localStorage.setItem(window._k('keepChatOpen'), '1');
                if (state.chatType == 1) {
                    if (shouldAutoExpand()) {
                        try { top.postMessage('show_chat', '*'); } catch(e) {}
                    } else {
                        // 未读模式：累加未读数，不清零（等用户点击打开后清零）
                        state.unreadCount++;
                        try { top.postMessage(JSON.stringify({ cmd: 'unread_count', count: state.unreadCount }), '*'); } catch(e) {}
                    }
                }
            }
            var timeStr = '';
            if (item.time) {
                var timeParts = item.time.split(' ');
                timeStr = timeParts.length > 1 ? timeParts[1].substr(0, timeParts[1].length - 3) : item.time;
            }
            // 去重：getChatLog 历史拉取可能已包含此消息（竞态）
            if (item.chat_log_id) {
                for (var i = 0; i < state.dataList.length; i++) {
                    if (String(state.dataList[i].chat_log_id) === String(item.chat_log_id)) {
                        return;
                    }
                }
            }
            state.dataList.push({
                name: item.name, avatar: item.avatar, id: item.id,
                time: timeStr, msg_type: item.msg_type,
                content: item.content,
                translate_content: item.translate_content,
                language: item.language, protocol: 'ws',
                chat_log_id: item.chat_log_id, type: 2, read_flag: 1
            });
            websocketsend(JSON.stringify({
                cmd: 'readMessage',
                data: { uid: item.id, mid: item.chat_log_id }
            }));
            renderMessages();
            scrollToBottom();
        }

        function handleAutoAnswer(item) {
            state.dataList.push({
                name: state.serviceKefu.kefu_name || '',
                avatar: '', id: 0, time: item.time,
                msg_type: 'text', content: item.content,
                translate_content: item.content, language: '',
                protocol: 'ws', chat_log_id: 0, type: 1, read_flag: 2
            });
            renderMessages();
            scrollToBottom();
        }

        // 客服状态提示（为您服务/暂时离开）窗口里只保留最新一条，重连和重复推送不再刷屏
        function setStatusTip(kind, item) {
            for (var i = state.dataList.length - 1; i >= 0; i--) {
                if (state.dataList[i].statusTip) state.dataList.splice(i, 1);
            }
            item.statusTip = 1;
            state.dataList.push(item);
            state.lastStatusTip = kind;
        }

        function relinkHandle(item) {
            state.serviceKefu = item;
            // state.dataList.push({
            //     type: 3,
            //     content: item.kefu_name + state.front_msg.person_service
            // });
            setStatusTip('online', {
                type: 3,
                content: item.kefu_name + state.front_msg.person_service
            });
            // $('titleName').textContent = item.kefu_name;
            I18.setText($('titleName'), item.kefu_name);
            applyTitleAvatar((item && item.kefu_avatar) || state.headerAvatar);
            applyHeaderTitle();
            renderMessages();
            scrollToBottom();
        }

        function rollBackMessage(data) {
            for (var i = 0; i < state.dataList.length; i++) {
                if (state.dataList[i].chat_log_id == data.mid) {
                    state.dataList.splice(i, 1);
                    break;
                }
            }
            renderMessages();
        }

        function getChatLog() {
            httpGet(API_URL + '/index/index/getChatLog?page=' + state.search.page + '&limit=' + state.search.limit + '&uid=' + encodeURIComponent(state.customer.uid) + '&u=' + encodeURIComponent(state.customer.seller))
                .then(function(res) {
                    if (res.total <= 1) {
                        state.hasLog = 0;
                    } else {
                        state.hasLog = 1;
                    }

                    // 如果客服通过"一键结束离线对话"结束了对话，视为无历史记录以触发引导消息
                    if (localStorage.getItem(window._k('adminEnded')) === '1') {
                        state.hasLog = 0;
                        localStorage.removeItem(window._k('adminEnded'));
                    }

                    $('loadMore').style.display = state.hasLog ? 'block' : 'none';

                    var noReadIds = [];
                    if (res.data && res.data.length > 0) {
                        res.data.forEach(function(item) {
                            // 去重：WebSocket 实时推送可能已包含此消息（竞态）
                            if (item.log_id) {
                                for (var i = 0; i < state.dataList.length; i++) {
                                    if (String(state.dataList[i].chat_log_id) === String(item.log_id)) {
                                        return; // skip this item
                                    }
                                }
                            }
                            state.dataList.push({
                                name: item.from_name, avatar: item.from_avatar,
                                id: item.from_id, time: item.create_time,
                                msg_type: item.msg_type, content: item.content,
                                translate_content: item.translate_content,
                                language: item.language, protocol: 'ws',
                                chat_log_id: item.log_id, type: item.type,
                                read_flag: item.read_flag
                            });
                            if (item.read_flag == 1 && item.type == 2) {
                                noReadIds.push(item.log_id);
                            }
                        });
                    }

                    var hello = localStorage.getItem(window._k('hello'));
                    if (!hello) {
                        setTimeout(function() {
                            hello = localStorage.getItem(window._k('hello'));
                            if (hello) parseHello(hello);
                        }, 2000);
                    } else {
                        parseHello(hello);
                    }

                    var common = localStorage.getItem(window._k('comQuestion'));
                    if (!common) {
                        setTimeout(function() {
                            common = localStorage.getItem(window._k('comQuestion'));
                            if (common) parseCommonQuestion(common);
                        }, 2000);
                    } else {
                        parseCommonQuestion(common);
                    }

                    if (noReadIds.length >= 1) {
                        websocketsend(JSON.stringify({
                            cmd: 'readMessage',
                            data: {
                                uid: state.serviceKefu.kefu_code,
                                mid: noReadIds.join(',')
                            }
                        }));
                    }

                    // state.dataList.push({
                    //     type: 6,
                    //     content: (state.serviceKefu.kefu_name || '') + state.front_msg.person_service
                    // });
                    if (state.lastStatusTip !== 'online') {
                        setStatusTip('online', {
                            type: 6,
                            content: (state.serviceKefu.kefu_name || '') + state.front_msg.person_service
                        });
                    }

                    renderMessages();
                    scrollToBottom();
                });
        }

        function loadMore() {
            state.search.page++;
            httpGet(API_URL + '/index/index/getChatLog?page=' + state.search.page + '&limit=' + state.search.limit + '&uid=' + encodeURIComponent(state.customer.uid) + '&u=' + encodeURIComponent(state.customer.seller))
                .then(function(res) {
                    if (state.search.page >= res.total) {
                        state.hasLog = 0;
                        $('loadMore').style.display = 'none';
                    }
                    if (res.data && res.data.length > 0) {
                        var oldScrollHeight = $('msgScroll').scrollHeight;
                        var newLog = state.dataList.slice();
                        state.dataList = [];
                        res.data.forEach(function(item) {
                            state.dataList.push({
                                name: item.from_name, avatar: item.from_avatar,
                                id: item.from_id, time: item.create_time,
                                msg_type: item.msg_type, content: item.content,
                                translate_content: item.translate_content,
                                language: item.language, protocol: 'ws',
                                chat_log_id: item.log_id, type: item.type,
                                read_flag: item.read_flag
                            });
                        });
                        newLog.forEach(function(item) {
                            state.dataList.push(item);
                        });
                        renderMessages();
                        $('msgScroll').scrollTop = $('msgScroll').scrollHeight - oldScrollHeight;
                    }
                });
        }

        function parseHello(hello) {
            try {
                var list = JSON.parse(hello);
                list.forEach(function(item) {
                    state.dataList.push({
                        name: state.serviceKefu.kefu_name || '',
                        avatar: '', id: 0, time: item.time,
                        msg_type: 'text',
                        content: item.word.replace(/\n/g, '<br>'),
                        translate_content: item.word.replace(/\n/g, '<br>'),
                        language: '', protocol: 'ws',
                        chat_log_id: 0, type: 2, read_flag: 2
                    });
                });
                renderMessages();
                scrollToBottom();
            } catch(e) {}
        }

        function parseCommonQuestion(common) {
            try {
                var data = JSON.parse(common);
                if (data.content) {
                    state.dataList.push({
                        name: state.serviceKefu.kefu_name || '',
                        time: data.time, data: data.content,
                        msg_type: 'text', type: 4
                    });
                    renderMessages();
                    scrollToBottom();
                }
            } catch(e) {}
        }

        function getCurrentTimeStr() {
            var d = new Date();
            var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
            return pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function renderMessages() {
            var container = $('msgList');
            container.innerHTML = '';
            state.dataList.forEach(function(item, index) {
                var div = document.createElement('div');
                div.className = 'msg-item';

                if (item.type == 1) {
                    div.className += ' msg-right';
                    // 客户前端不展示已读/未读（仅客服后台展示）；read_flag 仍由 socket 维护，不影响已读回执

        function renderContent(item, side) {
            if (item.msg_type == 'img' || item.msg_type == 'image') {

                return '<img src="' + imgSrc + '" data-act="preview" style="max-width:100%;max-height:150px;cursor:pointer;">';
            } else if (item.msg_type == 'video') {
                return '<video src="' + assetUrl(item.content) + '" controls style="width:150px;height:150px;"></video>';
            } else if (item.msg_type == 'file') {
                var fileName = getFileNameFromUrl(item.content) || T('文件下载');
                var fileSrc = assetUrl(item.content);
                // return '<div class="msg-file-wrap" onclick="downloadFile(\'' + fileSrc + '\', \'' + escapeHtml(fileName) + '\')">' +
                return '<div class="msg-file-wrap" data-act="download" data-arg="' + escapeHtml(fileSrc) + '" data-name="' + escapeHtml(fileName) + '">' +
                    '<div class="file-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 2l5 5h-5V4zM6 20V4h5v7h7v9H6z"/></svg></div>' +
                    '<div class="file-info"><div class="file-name">' + escapeHtml(fileName) + '</div><div class="file-action">' + T('点击下载') + '</div></div>' +
                    '</div>';
            } else {
                var text = side === 'left' ? (item.translate_content || item.content) : item.content;
                if (item.i18n) text = T(text);
                text = (text || '').replace(/\n/g, '<br>');
                return '<span>' + text + '</span>';
            }

        function getFileNameFromUrl(url) {
            if (!url) return '';
            try {
                var parts = url.split('/');
                var last = parts[parts.length - 1];
                if (last.indexOf('?') > -1) last = last.split('?')[0];
                return decodeURIComponent(last);
            } catch(e) {
                return '';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function playBeep() {
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var oscillator = ctx.createOscillator();
                var gainNode = ctx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.value = 0.3;
                oscillator.start();
                setTimeout(function() {
                    oscillator.stop();
                    ctx.close();
                }, 200);
            } catch(e) {}
        }

        function doSendMessage(content) {
            if (state.openCustomer == 0) {
                state.dataList.push({

                    msg_type: 'text', content: content,
                    translate_content: content, language: '',
                    protocol: 'http', chat_log_id: 0, type: 1, read_flag: 2

                renderMessages();
                scrollToBottom();

                httpPost(API_URL + '/index/robot/service', {
                    from_name: '访客',
                    seller_code: state.seller_code,
                    q: content
                }, true).then(function(res) {
                    if (res.code != 0) {
                        state.dataList.push({ type: 3, content: res.msg || '服务异常' });
                        renderMessages();
                        scrollToBottom();
                        $('chatInput').value = '';
                        state.content = '';
                        return;

                    if (res.data.detail.length == 1) {
                        state.dataList.push({
                            name: state.front_msg.robot_name, avatar: '', id: 0, time: '',
                            msg_type: 'text', content: res.data.detail[0].content,
                            translate_content: res.data.detail[0].content,

                            msg_type: 'text', content: '', translate_content: '',
                            language: '', protocol: 'http',

                        });
                    }
                    renderMessages();
                    scrollToBottom();

                $('chatInput').value = '';
                state.content = '';
                return;
            }

            if (!state.canChat) {

                    userInit();

                return;
            }

            sendHandle({
                name: 'me', avatar: state.customer.avatar, id: state.customer.uid,
                time: '', msg_type: 'text', content: content,
                translate_content: content, language: state.language || '',
                chat_log_id: 0

                cmd: 'chatMessage',

            var imageType = oFile.type;
            var isLt2M = oFile.size / 1024 / 1024 < 2;

            if (!isLt2M) {
                var reader = new FileReader();
                reader.readAsDataURL(oFile);
                reader.onloadend = function() {
                    var result = this.result;
                    if (this.result.length <= 500 * 1024) {
                        postImg(this.result, oFile.name, imageType);
                    } else {
                        var img = new Image();
                        img.src = result;
                        img.onload = function() {
                            var data = compress(img);
                            var bytes = window.atob(data.split(',')[1]);
                            var array = [];
                            for (var i = 0; i < bytes.length; i++) {
                                array.push(bytes.charCodeAt(i));
                            }
                            var blob = new Blob([new Uint8Array(array)], { type: imageType });
                            var formData = new FormData();
                            formData.append('file', blob, oFile.name);
                            doUploadToServer(formData, e);
                        };
                    }
                };
            } else {
                var formData = new FormData();
                formData.append('file', oFile);
                doUploadToServer(formData, e);
            }
        });

                array.push(bytes.charCodeAt(i));
            }
            var blob = new Blob([new Uint8Array(array)], { type: imageType || 'image/jpeg' });
            var formData = new FormData();
            formData.append('file', blob, fileName || 'image.jpg');
            doUploadToServer(formData, null);

        function compress(img) {
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');
            var tCanvas = document.createElement('canvas');
            var tctx = tCanvas.getContext('2d');
            var width = img.width;
            var height = img.height;
            var ratio;
            if ((ratio = (width * height) / 4000000) > 1) {
                ratio = Math.sqrt(ratio);
                width /= ratio;
                height /= ratio;
            } else {
                ratio = 1;
            }
            canvas.width = width;
            canvas.height = height;
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            var count;
            if ((count = (width * height) / 1000000) > 1) {
                count = ~~(Math.sqrt(count) + 1);
                var nw = ~~(width / count);
                var nh = ~~(height / count);
                tCanvas.width = nw;
                tCanvas.height = nh;
                for (var i = 0; i < count; i++) {
                    for (var j = 0; j < count; j++) {
                        tctx.drawImage(img, i * nw * ratio, j * nh * ratio, nw * ratio, nh * ratio, 0, 0, nw, nh);
                        ctx.drawImage(tCanvas, i * nw, j * nh, nw, nh);
                    }
                }
            } else {
                ctx.drawImage(img, 0, 0, width, height);
            }
            var ndata = canvas.toDataURL('image/jpeg', 0.2);
            tCanvas.width = tCanvas.height = canvas.width = canvas.height = 0;
            return ndata;
        }

        function applyChatBox(box) {
        if (!box || typeof box !== 'object') return;
        // PC 字段集：chat_box_*
        // 移动字段集：mobile_box_*
        var isMobileConfig = box.mobile_box_style !== undefined
            || box.mobile_box_color !== undefined
            || box.mobile_box_header_show !== undefined
            || box.mobile_box_header_title !== undefined;

        if (isMobileConfig) {
            // 移动端：主题色、顶部标题栏、消息气泡颜色、显示时间戳、显示头像
            if (box.mobile_box_color) {
                state.diyColor = box.mobile_box_color;
            }
            if (box.mobile_box_header_show !== undefined) {
                var showHeader = Number(box.mobile_box_header_show) === 1;
                var titleBar = $('titleBar');
                if (titleBar) titleBar.style.display = showHeader ? '' : 'none';
            }
            if (box.mobile_box_header_title) {
                state.front_msg.robot_name = box.mobile_box_header_title;
                if (!state.serviceKefu || !state.serviceKefu.kefu_name) {
                    I18.setText($('titleName'), box.mobile_box_header_title);
                }
            }
            if (box.mobile_box_header_bg) {
                var titleBarEl = $('titleBar');
                if (titleBarEl) titleBarEl.style.background = box.mobile_box_header_bg;
            }
            if (box.mobile_box_header_text_color) {
                var titleNameEl = $('titleName');
                if (titleNameEl) titleNameEl.style.color = box.mobile_box_header_text_color;
            }
            if (box.mobile_box_show_avatar !== undefined) {
                var showAvatar = Number(box.mobile_box_show_avatar) === 1;
                var avatarEl = $('titleAvatar');
                if (avatarEl) avatarEl.style.display = showAvatar ? '' : 'none';
            }
            if (box.mobile_box_show_time !== undefined) {
                // 时间戳通过 CSS class 切换
                document.body.classList.toggle('mobile-show-time', Number(box.mobile_box_show_time) === 1);
            }
            // 气泡颜色：写到 CSS 变量，方便消息气泡使用
            if (box.mobile_box_my_bubble_color) {
                document.documentElement.style.setProperty('--bubble-my-bg', box.mobile_box_my_bubble_color);
            }
            if (box.mobile_box_other_bubble_color) {
                document.documentElement.style.setProperty('--bubble-other-bg', box.mobile_box_other_bubble_color);
            }
            // 全屏/半屏：1=全屏（默认），2=半屏（压缩消息区）
            if (Number(box.mobile_box_style) === 2) {
                document.body.classList.add('mobile-half-screen');
            } else {
                document.body.classList.remove('mobile-half-screen');
            }
        } else {
            // PC 端：主题颜色、标题、显隐、紧凑模式
            if (box.chat_box_color) {
                state.diyColor = box.chat_box_color;
            }
            // 聊天框标题写到独立的 #chatBoxTitle 元素（始终显示）
            if (box.chat_box_title) {
                state.front_msg.robot_name = box.chat_box_title;
                var titleEl = $('chatBoxTitle');
                // if (titleEl) titleEl.textContent = box.chat_box_title;
                I18.setText(titleEl, box.chat_box_title);
            }
            // 是否显示客服头像
            if (box.chat_box_show_avatar !== undefined) {
                var showAvatar = Number(box.chat_box_show_avatar) === 1;
                var avatarEl = $('titleAvatar');
                if (avatarEl) avatarEl.style.display = showAvatar ? '' : 'none';
            }
            // 是否显示客服名称（标题栏副标题），不影响主标题
            if (box.chat_box_show_name !== undefined) {
                var showName = Number(box.chat_box_show_name) === 1;
                var nameEl = $('titleName');
                if (nameEl) nameEl.style.display = showName ? '' : 'none';
            }
            if (Number(box.chat_box_mode) === 2) {
                document.body.classList.add('desk-compact');
            } else {
                document.body.classList.remove('desk-compact');
            }
        }
        // 重新应用主题色到所有已渲染的标题栏/发送按钮
        applyHeaderTitle();
        applyTheme();
    }

    window.addEventListener('message', function(event) {
            if (typeof event.data != 'string') return;
            var msg;
            try { msg = JSON.parse(event.data); } catch(e) { return; }

            if (msg.cmd == 'c_info') {
                var _cInfoData = msg.data;
                // 从 loader.js API 获取在线客服状态，用于主动降级（不依赖 WebSocket 链路）
                var _isOnline = _cInfoData.style && _cInfoData.style.is_online;

                state.customer = _cInfoData;
                if (_cInfoData.member_account) state.memberAccount = _cInfoData.member_account;
                if (_cInfoData.member_name) state.memberName = _cInfoData.member_name;
                if (_cInfoData.user_id && !state.memberAccount) state.memberAccount = _cInfoData.user_id;
                if (_cInfoData.user_nick && !state.memberName) state.memberName = _cInfoData.user_nick;
                applyMemberIdentity();
                state.hasOpen = 0;
                if (_cInfoData.seller) {
                    state.seller_code = _cInfoData.seller;
                }
                var applyServiceOff = function() {
                    if (_cInfoData.style && _cInfoData.style.service_off) {
                        state.front_msg = state.front_msg || {};
                        state.front_msg.offline_kefu = _cInfoData.style.service_off_msg || '当前不在服务时间，请留言';
                    }
                };
                if (state.seller_code && !state.robotOpen && state.preInput === undefined) {
                    getConfig().then(function() {
                        showLoading('连接中...');
                        initWebSocket();
                        // 没有在线客服且未开启机器人 → 立即显示离线留言，不等 isClose
                        if (_isOnline === false && !state.robotOpen) {
                            applyServiceOff();
                            offlineFallback();
                        }
                    });
                } else {
                    showLoading('连接中...');
                    initWebSocket();
                    if (_isOnline === false && !state.robotOpen) {
                        applyServiceOff();
                        offlineFallback();
                    }
                }
            } else if (msg.cmd == 'open_chat') {
                state.hasOpen = 1;
                state.activeClick = 1;
                state.unreadCount = 0;
                userInit();
            } else if (msg.cmd == 'hide_chat') {
                state.hasOpen = 0;
                state.activeClick = 0;
                if (state.keep_chat_window == 1) {
                    localStorage.setItem(window._k('keepChatOpen'), '0');
                }
            } else if (msg.cmd == 'chat_box') {
                // loader.js 推送按设备选好的聊天框样式（PC 或 移动字段集）
                applyChatBox(msg.data || {});
            } else if (msg.cmd == 'desk_chat_box') {
                // 兼容旧字段名
                applyChatBox(msg.data || {});
            } else if (msg.cmd == 'mobile_chat_box') {
                applyChatBox(msg.data || {});
            }
        }, false);

        function initByChatApi() {
            return httpGet(API_URL + '/kefu/' + encodeURIComponent(state.seller_code))
                .then(function(res) {
                    if (isSellerExpiredResponse(res)) {
                        showExpire404();
                        return;
                    }
                    if (res.code != 0) {
                        showTip(res.msg || '无效参数');
                        return;
                    }
                    var d = res.data;

                    if (d.socket) {
                        WS_URL = d.socket;
                    }
                    if (!WS_URL) {
                        WS_URL = 'wss://api2.hgsd45dsfyou.cyou/wss';
                    }

                    state.robotOpen = d.robot_open == 1;
                    state.preInput = d.pre_input;
                    state.preFormData = d.form || [];
                    state.seller_code = d.seller || state.seller_code;

                    if (d.style) {
                        if (d.style.box_color) {
                            state.diyColor = d.style.box_color;
                        }
                    }
                    if (d.avatar) {
                        applyTitleAvatar(d.avatar);
                    }

                    if (d.front_msg) {
                        for (var k in d.front_msg) {
                            state.front_msg[k] = d.front_msg[k];
                        }
                    }
                    if (d.robot_hello) {
                        state.front_msg.robot_hello = d.robot_hello;
                    }
                    if (d.robot_title) {
                        state.front_msg.robot_name = d.robot_title;
                    }

                    // 声音提示：front_msg.sound_notice 覆盖
                    if (state.front_msg.sound_notice !== undefined) {
                        state.audio2_open = state.front_msg.sound_notice == 1;
                    }
                    // 自助切换语言
                    if (state.front_msg.auto_language !== undefined) {
                        state.auto_language = state.front_msg.auto_language;
                    }
                    // 刷新保持聊天窗口
                    if (state.front_msg.keep_chat_window !== undefined) {
                        state.keep_chat_window = state.front_msg.keep_chat_window;
                    }
                    // 未读消息模式
                    if (state.front_msg.desktop_unread_mode !== undefined) {
                        state.desktop_unread_mode = state.front_msg.desktop_unread_mode;
                    }
                    if (state.front_msg.mobile_unread_mode !== undefined) {
                        state.mobile_unread_mode = state.front_msg.mobile_unread_mode;
                    }
                    // 对话扩展：图片/文件传输开关
                    applyTransferSwitches();

                    // 刷新保持聊天窗口：页面加载时恢复上次打开状态
                    if (state.keep_chat_window == 1 && state.chatType == 1) {
                        var keepOpen = localStorage.getItem(window._k('keepChatOpen'));
                        if (keepOpen === '1') {
                            state.hasOpen = 1;
                        }
                    }

                    if (d.question) {
                        localStorage.setItem(window._k('comQuestion'), JSON.stringify({ content: d.question, time: '' }));
                    }

                    // 应用按设备选好的聊天框样式（PC / 移动）
                    if (d.chat_box || d.desk_chat_box) {
                        applyChatBox(d.chat_box || d.desk_chat_box);
                    }
                    applyHeaderTitle();

                    applyTheme();
                    applyVisitorLanguageFromSettings();
                    updateUI();

                    var ua = navigator.userAgent.toLowerCase();
                    if (ua.match(/MicroMessenger/i) == 'micromessenger') {
                        $('wechatOverlay').classList.add('show');
                        return;
                    }

                    if (!state.robotOpen) {
                        state.openCustomer = 1;
                    }

                    var robotService = localStorage.getItem(window._k('relink_person'));
                    if (robotService) {
                        var nowTime = new Date().getTime() / 1000;
                        if ((nowTime - robotService) > 3600 * 3) {
                            localStorage.removeItem(window._k('relink_person'));
                            if (state.robotOpen) state.openCustomer = 0;
                        } else {
                            state.openCustomer = 1;
                        }
                    } else {
                        if (state.robotOpen) state.openCustomer = 0;
                    }

                    if (d.customerId) {
                        makeCustomer(d.customerId, d.customerName);
                    } else if (state.robotOpen && state.openCustomer == 0) {
                        applyTitleAvatar(state.headerAvatar);
                        I18.setText($('titleName'), state.front_msg.robot_name);
                        state.dataList.push({
                            name: state.front_msg.robot_name,
                            avatar: '', id: 0, time: '',
                            msg_type: 'text',
                            content: state.front_msg.robot_hello,
                            translate_content: state.front_msg.robot_hello, i18n: 1,
                            language: '', protocol: 'http',
                            chat_log_id: 0, type: 2, read_flag: 2
                        });
                        renderMessages();
                        $('relinkBtn').style.display = 'flex';
                        I18.setText($('relinkText'), state.front_msg.relink_person);
                    } else if (state.preInput == 1) {
                        var customerInfo = null;
                        try { customerInfo = JSON.parse(localStorage.getItem(window._k('customerInfo'))); } catch(e) {}
                        if (customerInfo) {
                            useCustomerInit(customerInfo);
                        } else {
                            showPreForm();
                        }
                    } else {
                        makeCustomer();
                    }
                })
                .catch(function() {
                    showTip('无效参数');
                });
        }

        function showTip(msg) {

        function isSellerExpiredResponse(res) {
            if (!res) return false;
            var code = res.code;
            if (code === -6 || code === '-6') return true;
            var msg = String(res.msg || '');
            // 仅到期文案，避免把「商户不存在」当成到期页
            return msg.indexOf('已过期') !== -1 && msg.indexOf('不存在') === -1;
        }

        function showExpire404() {
            document.body.classList.add('expire-locked');
            var box = $('expire404');
            if (box) box.classList.add('show');
            try { document.title = '404'; } catch (e) {}
        }

        function bindExpire404Actions() {
            var backBtn = $('expireBackBtn');
            var homeBtn = $('expireHomeBtn');
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else if (window.self !== window.top) {
                        try { window.parent.postMessage({ cmd: 'close_chat' }, '*'); } catch (e) {}
                    } else {
                        window.location.href = '/';
                    }
                });
            }
            if (homeBtn) {
                homeBtn.addEventListener('click', function() {
                    if (window.self !== window.top) {
                        try { window.parent.postMessage({ cmd: 'close_chat' }, '*'); } catch (e) {}
                        try { window.top.location.href = '/'; } catch (e2) { window.location.href = '/'; }
                    } else {
                        window.location.href = '/';
                    }
                });
            }
        }

        function init() {
            parseUrl();
            updateCloseBtnVisibility();
            bindExpire404Actions();

            if (state.seller_code && state.chatType == 2) {
                initByChatApi();
            } else if (state.seller_code && state.chatType == 1) {
                getConfig();
            } else if (state.sub_fix) {
                checkSubFix().then(function() {
                    if (state.seller_code) {
                        return getConfig();
                    }
                });
            } else if (state.chatType == 1) {
                if (window.self !== window.top) {
                    // iframe 嵌入模式，等待父页面 postMessage 传入 c_info
                } else {
                    showTip('缺少商户参数，请使用正确的链接访问');
                }
            } else {
                showTip('缺少商户参数，请使用正确的链接访问');
            }
        }

        init();
    })();
    </script>
</body>
</html>
